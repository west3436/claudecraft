pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    // Allows Gradle to auto-provision a matching JDK 21 toolchain if one is not
    // already installed locally.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
