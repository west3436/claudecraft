plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.2.2'
group = 'com.claudecraft'

base {
    archivesName = 'claudecraft'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven {
        url = "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }
}

neoForge {
    version = "21.1.234"

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        claudecraft {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // CC: Tweaked API. For Minecraft 1.21.1 the "forge" artifacts are built
    // for NeoForge (their jars ship META-INF/neoforge.mods.toml), so these are
    // the correct coordinates for a NeoForge mod.
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-forge-api:1.117.1"
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-core-api:1.117.1"
    runtimeOnly "cc.tweaked:cc-tweaked-1.21.1-forge:1.117.1"

    // Gson for JSON (bundled with Minecraft, declared for compile)
    compileOnly "com.google.code.gson:gson:2.10.1"
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "ClaudeCraft",
            "Specification-Vendor"    : "ClaudeCraft",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "ClaudeCraft",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
